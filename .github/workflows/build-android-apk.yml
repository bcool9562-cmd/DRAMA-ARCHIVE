name: Build Native Android SCENOVA.apk

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'
      - 'android/**'
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Native SCENOVA.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install --legacy-peer-deps
          cd ..

      - name: Prepare Keystore & assetlinks.json
        run: |
          mkdir -p mobile/android/app public/.well-known
          if [ -f android/scenova.keystore ]; then
            cp android/scenova.keystore mobile/android/app/scenova.keystore
          elif [ -f mobile/android/app/scenova.keystore ]; then
            echo "Keystore already present in mobile/android/app"
          else
            echo "Generating permanent release keystore..."
            keytool -genkeypair -v \
              -keystore mobile/android/app/scenova.keystore \
              -alias scenova \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass scenova2026 \
              -keypass scenova2026 \
              -dname "CN=SCENOVA, OU=Mobile, O=SCENOVA, L=SanFrancisco, S=CA, C=US"
          fi

          CERT_FP=$(keytool -list -v -keystore mobile/android/app/scenova.keystore -alias scenova -storepass scenova2026 | grep -i "SHA256:" | head -n 1 | awk '{print $2}' | tr -d '\r')
          echo "Release Key SHA-256: $CERT_FP"

          cat <<EOF > public/.well-known/assetlinks.json
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "app.vercel.drama_archive_pearl",
                "sha256_cert_fingerprints": ["$CERT_FP"]
              }
            }
          ]
          EOF

      - name: Build Signed Native Android APK with Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cd ../..

          APK_PATH="mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" SCENOVA.apk
            cp SCENOVA.apk public/SCENOVA.apk
            echo "Successfully built SCENOVA.apk ($(stat -c%s SCENOVA.apk) bytes)"
            ls -lh SCENOVA.apk
          else
            echo "Failed to find built APK at $APK_PATH"
            exit 1
          fi

      - name: Update git tag latest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force || true

      - name: Upload SCENOVA.apk as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCENOVA-Android-APK
          path: SCENOVA.apk
          if-no-files-found: error

      - name: Publish SCENOVA.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "SCENOVA Native Android v1.0"
          prerelease: false
          make_latest: true
          body: |
            ### 📱 SCENOVA 100% Native Android App
            - 100% Real Native Views (React Native + Expo SDK 52)
            - Locked 120 FPS buttery smooth FlashList grids
            - Native Stack edge-swipe gestures
            - PIN & Biometric App Lock
            - Offline-first instant 0.1s caching
            - Direct download: [`SCENOVA.apk`](https://github.com/${{ github.repository }}/releases/latest/download/SCENOVA.apk)
          files: SCENOVA.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Keystore, APK, and assetlinks.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/SCENOVA.apk public/.well-known/assetlinks.json
          git commit -m "Auto-commit signed SCENOVA.apk and assetlinks [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
