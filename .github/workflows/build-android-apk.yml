name: Build Native Android SCENOVA.apk

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
      - 'app/**'
      - 'components/**'
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Full-Screen SCENOVA.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate or Verify Keystore & assetlinks.json
        run: |
          mkdir -p android public/.well-known
          if [ ! -f android/scenova.keystore ]; then
            echo "Generating permanent release keystore..."
            keytool -genkeypair -v \
              -keystore android/scenova.keystore \
              -alias scenova \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass scenova2026 \
              -keypass scenova2026 \
              -dname "CN=SCENOVA, OU=Mobile, O=SCENOVA, L=SanFrancisco, S=CA, C=US"
          fi

          CERT_FP=$(keytool -list -v -keystore android/scenova.keystore -alias scenova -storepass scenova2026 | grep -i "SHA256:" | head -n 1 | awk '{print $2}' | tr -d '\r')
          echo "Release Key SHA-256: $CERT_FP"

          cat <<EOF > public/.well-known/assetlinks.json
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "app.vercel.drama_archive_pearl",
                "sha256_cert_fingerprints": ["$CERT_FP"]
              }
            }
          ]
          EOF

      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Signed Native Android APK with Gradle
        run: |
          cd android
          gradle assembleRelease --stacktrace
          cd ..
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" SCENOVA.apk
            cp SCENOVA.apk public/SCENOVA.apk
            echo "Successfully built SCENOVA.apk ($(stat -c%s SCENOVA.apk) bytes)"
            ls -lh SCENOVA.apk
          else
            echo "Failed to find built APK at $APK_PATH"
            exit 1
          fi

      - name: Update git tag latest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force || true

      - name: Upload SCENOVA.apk as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCENOVA-Android-APK
          path: SCENOVA.apk
          if-no-files-found: error

      - name: Publish SCENOVA.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "SCENOVA Android App v1.0"
          prerelease: false
          make_latest: true
          body: |
            ### 📱 SCENOVA Native Android Release
            - Immersive full-screen edge-to-edge experience
            - Real background Push Notifications
            - Tactile haptic engine
            - Direct download: [`SCENOVA.apk`](https://github.com/${{ github.repository }}/releases/latest/download/SCENOVA.apk)
          files: SCENOVA.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Keystore, APK, and assetlinks.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/scenova.keystore public/SCENOVA.apk public/.well-known/assetlinks.json
          git commit -m "Auto-commit signed SCENOVA.apk and assetlinks [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
