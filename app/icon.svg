<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="scenova-circle-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <!-- Deep Pure Black #050507 Squircle Base -->
  <rect width="512" height="512" rx="124" fill="#050507" />

  <!-- Crisp Circular Rose-Pink Gradient Emblem -->
  <circle cx="256" cy="256" r="176" fill="url(#scenova-circle-grad)" />

  <!-- Pure-White Interlocking Geometric Twin-Ring / Angled Cinema-Lens Cut -->
  <g transform="translate(136, 136) scale(10)" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Upper angled cinema ring / aperture arc -->
    <path d="M 6.5 11.5 A 5.5 5.5 0 1 1 17.5 12" />
    <!-- Lower angled cinema ring / aperture arc -->
    <path d="M 17.5 12.5 A 5.5 5.5 0 1 1 6.5 12" />
    <!-- Angled cinema-lens aperture cut -->
    <path d="M 7.5 16.5 L 16.5 7.5" />
  </g>
</svg>
